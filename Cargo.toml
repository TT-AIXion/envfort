[package]
name = "envfort"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
description = "Write-only environment variable secret vault with keychain-backed envelope encryption"
license = "MIT"
repository = "https://github.com/TT-AIXion/envfort"
homepage = "https://github.com/TT-AIXion/envfort"
readme = "README.md"
keywords = ["secrets", "vault", "keychain", "cli", "encryption"]
categories = ["command-line-utilities", "cryptography"]

[dependencies]
aes-gcm-siv = "0.11.1"
argon2 = "0.5.3"
axum = "0.8.4"
bincode = "1"
chrono = "0.4.44"
clap = { version = "4.5.60", features = ["derive"] }
getrandom = "0.4.2"
keyring = "3.6.3"
libc = "0.2.182"
rand = "0.10.0"
rpassword = "7.4.0"
rusqlite = { version = "0.38.0", features = ["bundled"] }
secrecy = "0.10.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
thiserror = "2.0.18"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "net", "time", "sync"] }
toml = "1.0.3"
uuid = { version = "1.21.0", features = ["v4"] }
zeroize = "1.8.2"

[dev-dependencies]
tower = { version = "0.5.2", features = ["util"] }
