name: Automerge

on:
  pull_request_target:
    types: [opened, reopened, synchronize, labeled, unlabeled, ready_for_review]
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate automerge policy
        id: gate
        uses: actions/github-script@v8
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            let pullNumber = null;
            if (context.eventName === "pull_request_target") {
              pullNumber = context.payload.pull_request.number;
            } else if (context.eventName === "workflow_run") {
              const run = context.payload.workflow_run;
              if (run.name !== "CI" || run.conclusion !== "success") {
                core.setOutput("eligible", "false");
                core.setOutput("reason", "CI workflow is not successful");
                return;
              }
              if (!run.pull_requests || run.pull_requests.length === 0) {
                core.setOutput("eligible", "false");
                core.setOutput("reason", "No pull request attached to workflow_run");
                return;
              }
              pullNumber = run.pull_requests[0].number;
            }

            const { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: pullNumber,
            });

            const labels = pr.labels.map((label) => label.name);
            if (pr.draft) {
              core.setOutput("eligible", "false");
              core.setOutput("reason", "Pull request is draft");
              return;
            }
            if (!labels.includes("automerge")) {
              core.setOutput("eligible", "false");
              core.setOutput("reason", "Missing automerge label");
              return;
            }

            const { data: workflowRuns } = await github.rest.actions.listWorkflowRunsForRepo({
              owner,
              repo,
              head_sha: pr.head.sha,
              per_page: 30,
            });

            const ciRuns = workflowRuns.workflow_runs
              .filter((run) => run.name === "CI")
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

            if (ciRuns.length === 0) {
              core.setOutput("eligible", "false");
              core.setOutput("reason", "No CI workflow run found");
              return;
            }

            const latestCI = ciRuns[0];
            if (latestCI.status !== "completed" || latestCI.conclusion !== "success") {
              core.setOutput("eligible", "false");
              core.setOutput("reason", `CI not successful: ${latestCI.status}/${latestCI.conclusion}`);
              return;
            }

            core.setOutput("eligible", "true");
            core.setOutput("reason", "Policy satisfied");
            core.setOutput("pull_number", String(pullNumber));

      - name: Enable pull request automerge
        if: steps.gate.outputs.eligible == 'true'
        uses: peter-evans/enable-pull-request-automerge@v3
        with:
          pull-request-number: ${{ steps.gate.outputs.pull_number }}
          merge-method: squash

      - name: Skip automerge
        if: steps.gate.outputs.eligible != 'true'
        run: |
          echo "Automerge not enabled: ${{ steps.gate.outputs.reason }}"
